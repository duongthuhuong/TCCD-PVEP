:root{
--paper:#f7fafb;
--white:#fff;
--ink:#26343b;
--muted:#66767d;
--red:#d9783d;
--gold:#f0a24d;
--line:#d7e1e3;
--green:#587a72;
--shadow:0 16px 46px rgba(35,67,78,.09)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
font-family:"Segoe UI",Tahoma,Arial,sans-serif;
background:var(--paper);
color:var(--ink)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
height:100vh;
display:grid;
grid-template-rows:62px 3px 1fr 64px
}

header{
display:flex;
align-items:center;
padding:0 28px;
background:#fff;
border-bottom:1px solid #e6edef;
gap:12px
}

.logo{
width:40px;
height:40px;
border-radius:50%;
display:grid;
place-items:center;
background:var(--red);
color:#fff;
font-size:10px;
font-weight:900
}

.brand b{
font-size:13px;
letter-spacing:.12em
}

.brand small{
display:block;
color:#718188;
margin-top:2px
}

.headActions{
margin-left:auto;
display:flex;
gap:10px;
align-items:center
}

.lookupBtn{
border:1px solid #d6e2e5;
background:#fff;
border-radius:999px;
padding:9px 14px;
font-weight:750;
color:#315766
}

.lookupBtn:hover{
background:#edf4f6;
border-color:#a9c1c8
}

.counter{
font-size:12px;
font-weight:800;
color:#718188
}

.progress{background:#e4ecee}

.progress div{
height:3px;
background:linear-gradient(90deg,#47717c,var(--orange,#d9783d),#f0a24d);
transition:.35s
}

.stage{
position:relative;
overflow:hidden
}

.slide{
position:absolute;
inset:0;
padding:4.5vh 7vw 3vh;
overflow:auto;
opacity:0;
transform:translateX(45px);
pointer-events:none;
transition:.45s
}

.slide.active{
opacity:1;
transform:none;
pointer-events:auto
}

.slide.old{transform:translateX(-45px)}

footer{
display:flex;
align-items:center;
padding:0 28px;
background:#fff;
border-top:1px solid #e1eaec
}

.round{
width:40px;
height:40px;
border:1px solid var(--line);
border-radius:50%;
background:#fff;
color:#315766
}

.round:hover{background:#edf4f6}

.next{
margin-left:auto;
border:0;
border-radius:999px;
padding:11px 18px;
background:#315766;
color:#fff;
font-weight:800
}

.next:hover{background:#274b58}

.chapter{
margin-left:14px;
color:#718188;
font-size:11px
}

.eyebrow,.kicker{
color:#d9783d;
font-size:11px;
font-weight:900;
letter-spacing:.18em;
text-transform:uppercase;
margin-bottom:12px
}

h1,h2,h3{
margin-top:0;
font-family:"Segoe UI",Tahoma,Arial,sans-serif
}

h1{
font-size:clamp(46px,6vw,82px);
line-height:1.03;
letter-spacing:-.045em
}

h2{
font-size:clamp(30px,3.2vw,48px);
line-height:1.1;
letter-spacing:-.035em;
margin-bottom:18px
}

h3{font-size:17px}

.lead{
font-size:clamp(16px,1.5vw,21px);
line-height:1.58;
color:#5f7077;
max-width:950px
}

.cover,.module{
background:
radial-gradient(circle at 85% 18%,rgba(240,162,77,.17),transparent 27%),
linear-gradient(120deg,#315766,#47717c);
color:#fff
}

.cover .eyebrow,.module .eyebrow{
color:#ffd0a6
}

.cover p,.module p{
color:#eef5f6;
font-size:19px;
max-width:850px
}

.hero{
max-width:920px;
margin-top:5vh
}

.goldline{
width:100px;
height:3px;
background:#f0a24d;
margin:22px 0
}

.primary{
border:0;
background:#d9783d;
color:#fff;
border-radius:999px;
padding:11px 17px;
font-weight:800;
margin-top:14px
}

.primary:hover{
background:#c96730
}

.cards{
display:grid;
gap:14px;
margin-top:22px
}

.cards.two{grid-template-columns:repeat(2,1fr)}
.cards.three{grid-template-columns:repeat(3,1fr)}
.cards.four{grid-template-columns:repeat(4,1fr)}

article,.callout,.metric{
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:19px;
box-shadow:var(--shadow)
}

article b{
font-size:27px;
color:#d9783d
}

article p,.metric p{
font-size:13px;
color:#687980;
line-height:1.55
}

.callout{
margin-top:20px;
box-shadow:none;
border-left:4px solid #f0a24d;
line-height:1.55
}

.warn{
background:#fff6ed;
border-left-color:#f0a24d
}

.ok{
background:#edf5f2;
border-left-color:#587a72
}

.bad{
background:#fff0e7;
border-left-color:#d9783d
}

.split{
display:grid;
grid-template-columns:1fr 1fr;
gap:35px;
align-items:center
}

.metric span{
display:block;
font-size:clamp(58px,8vw,110px);
font-weight:850;
color:#d9783d;
line-height:1
}

.metric b{font-size:18px}

.metric.accent span{
color:#f0a24d
}

.chips{
display:flex;
flex-wrap:wrap;
gap:10px;
margin:24px 0
}

.chips span{
background:#fff;
border:1px solid var(--line);
border-radius:999px;
padding:11px 15px;
font-weight:700
}

.flow{
display:flex;
align-items:stretch;
gap:8px;
margin:28px 0;
overflow:auto
}

.flow>span{
min-width:130px;
flex:1;
background:#416774;
color:#fff;
border-radius:13px;
padding:16px;
text-align:center;
font-weight:800
}

.flow>span:nth-of-type(even){
background:#d9783d
}

.flow small{
font-weight:500;
opacity:.88
}

.flow i{
display:grid;
place-items:center;
font-style:normal;
color:#819198;
font-size:20px
}

.mc{
display:grid;
gap:10px;
max-width:900px
}

.mc button{
background:#fff;
border:1px solid var(--line);
padding:14px;
border-radius:11px;
text-align:left;
color:#26343b
}

.mc button:hover{
border-color:#789aa5;
background:#f3f8f9
}

.mc button.good,.clickcard.good{
background:#edf5f2;
border-color:#78907a
}

.mc button.bad,.clickcard.bad{
background:#fff0e7;
border-color:#d9783d
}

.feedback{
margin-top:12px;
min-height:40px
}

.levels{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
align-items:end;
margin-top:28px
}

.levels span{
background:#fff;
border:1px solid var(--line);
border-radius:14px;
padding:15px;
min-height:110px
}

.levels span:nth-child(2){min-height:135px}
.levels span:nth-child(3){min-height:160px}
.levels span:nth-child(4){min-height:185px}

.levels span:nth-child(5){
min-height:210px;
background:#416774;
color:#fff
}

.levels b{
display:block;
font-size:32px;
color:#d9783d
}

.levels span:nth-child(5) b{
color:#ffd0a6
}

.clickcard{cursor:pointer}

.reviewRow{
display:grid;
grid-template-columns:190px 1fr 40px;
gap:12px;
align-items:center;
padding:10px 0;
border-bottom:1px solid var(--line);
max-width:900px
}

input[type=range]{
width:100%;
accent-color:#d9783d
}

textarea,input[type=date],select,input[type=text]{
width:100%;
border:1px solid var(--line);
border-radius:10px;
padding:10px;
background:#fff;
color:#26343b
}

textarea{min-height:75px}

label{
display:block;
font-weight:800;
margin-bottom:8px
}

.form small{
display:block;
margin-top:8px
}

.quizBox{
max-width:900px;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
padding:22px
}

.quizBox .q{
font-size:23px;
font-weight:750;
margin:15px 0
}

.quizBar{
height:5px;
background:#e6edef;
border-radius:5px;
overflow:hidden
}

.quizBar i{
display:block;
height:100%;
background:linear-gradient(90deg,#47717c,#d9783d)
}

/* ===== TRA CỨU TCCD ===== */

.modal{
position:fixed;
inset:0;
background:rgba(31,48,55,.72);
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:22px
}

.modal.on{display:flex}

.panel{
width:min(1180px,96vw);
height:min(86vh,850px);
background:#f7fafb;
border-radius:20px;
overflow:hidden;
display:grid;
grid-template-rows:auto auto 1fr;
box-shadow:0 30px 90px rgba(21,48,58,.28)
}

.panelHead{
display:flex;
align-items:center;
padding:18px 22px;
background:#fff;
border-bottom:1px solid var(--line)
}

.panelHead small{
color:#d9783d;
font-weight:850;
letter-spacing:.1em
}

.panelHead h3{
margin:0;
font-size:22px;
color:#315766
}

.close{
margin-left:auto;
border:0;
background:#edf3f4;
border-radius:50%;
width:38px;
height:38px;
color:#315766
}

.filters{
display:grid;
grid-template-columns:1.1fr 1.7fr .7fr;
gap:10px;
padding:14px 22px;
background:#fff;
border-bottom:1px solid var(--line)
}

.lookupBody{
overflow:auto;
padding:20px 22px
}

.roleTitle{
display:flex;
gap:12px;
align-items:flex-start;
justify-content:space-between
}

.roleTitle h2{
color:#315766
}

.badge{
display:inline-block;
border-radius:999px;
background:#edf3f4;
color:#416774;
padding:6px 10px;
font-size:11px;
font-weight:800;
margin-right:5px
}

.reqGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:15px 0
}

.req{
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:14px
}

.req>b{
color:#d9783d
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
font-size:12px
}

th,td{
border:1px solid #dce5e7;
padding:9px;
vertical-align:top
}

th{
background:#3f6875;
color:#fff;
position:sticky;
top:0
}

td.lv{
text-align:center;
font-weight:850;
color:#d9783d
}

.sectionRow td{
background:#edf3f4;
color:#315766;
font-weight:850
}

.sourceNote{
font-size:11px;
color:#718188;
margin-top:12px
}

@media(max-width:850px){
.slide{padding:28px 20px}
.cards.two,.cards.three,.cards.four,.split,.filters,.reqGrid{
grid-template-columns:1fr
}
.flow{align-items:stretch}
.levels{
grid-template-columns:1fr;
align-items:stretch
}
.levels span:nth-child(n){min-height:auto}
.lookupBtn{display:none}
.reviewRow{grid-template-columns:1fr}
}

      <h3>Lãnh đạo</h3>

        Xác định yêu cầu, định hướng phát triển, giao việc và tạo cơ hội
        để nhân sự nâng cao năng lực.
      </p>
    </article>

    <article>
      <b>HR</b>
      <h3>QTNNL</h3>
      <p>
        Quản trị hệ thống tiêu chuẩn, tổ chức đánh giá và kết nối kết quả
        với các hoạt động nhân sự.
      </p>
    </article>

    <article>
      <b>CBNV</b>
      <h3>Người lao động</h3>
      <p>
        Hiểu chuẩn của mình, chủ động học tập, thực hành và tạo minh chứng
        năng lực trong công việc.
      </p>
    </article>
  </div>

/* ===================== 13 ===================== */
{
chapter:"Module 2 · Đọc chuẩn năng lực",
html:`
<section class="slide">
  <div class="eyebrow">BẰNG CẤP</div>
  <h2>Đọc yêu cầu bằng cấp như thế nào?</h2>

  <div class="split">
    <div>
      <p class="lead">
        Bằng cấp là một trong các điều kiện hồ sơ của chức danh.
        Khi tra cứu cần đọc đầy đủ cả trình độ và nhóm chuyên ngành phù hợp.
      </p>

      <div class="callout warn">
        Không nên chỉ nhìn cụm từ <b>“đại học trở lên”</b>
        mà bỏ qua yêu cầu về chuyên ngành hoặc lĩnh vực liên quan.
      </div>
    </div>

    <div class="cards two">
      <article>
        <b>01</b>
        <h3>Trình độ</h3>
        <p>Ví dụ: đại học hoặc trên đại học theo yêu cầu chức danh.</p>
      </article>

      <article>
        <b>02</b>
        <h3>Chuyên ngành</h3>
        <p>Đối chiếu đúng nhóm ngành được quy định cho chức danh.</p>
      </article>
    </div>
  </div>
</section>`
},

/* ===================== 14 ===================== */
{
chapter:"Module 2 · Đọc chuẩn năng lực",
html:`
<section class="slide">
  <div class="eyebrow">KINH NGHIỆM</div>
  <h2>Kinh nghiệm không chỉ là “đã làm bao nhiêu năm”</h2>

  <div class="cards three">
    <article>
      <b>01</b>
      <h3>Kinh nghiệm chuyên môn</h3>
      <p>
        Thời gian thực tế làm việc trong lĩnh vực chuyên môn liên quan.
      </p>
    </article>

    <article>
      <b>02</b>
      <h3>Kinh nghiệm quản lý</h3>
      <p>
        Áp dụng với những chức danh có yêu cầu kinh nghiệm quản lý.
      </p>
    </article>

    <article>
      <b>03</b>
      <h3>Theo bậc</h3>
      <p>
        Với một số chức danh, số năm kinh nghiệm thay đổi theo bậc.
      </p>
    </article>
  </div>

  <div class="callout">
    Khi sử dụng công cụ tra cứu, hệ thống sẽ hiển thị
    yêu cầu kinh nghiệm tương ứng với đúng bậc đã chọn.
  </div>
</section>`
},

/* ===================== 15 ===================== */
{
chapter:"Module 2 · Đọc chuẩn năng lực",
html:`
<section class="slide">
  <div class="eyebrow">TỪ ĐIỂN NĂNG LỰC</div>
  <h2>Từ tên năng lực đến yêu cầu của chức danh</h2>

  <div class="flow">
    <span>Từ điển năng lực<br><small>Năng lực là gì?</small></span>
    <i>→</i>
    <span>Mã năng lực<br><small>Ví dụ KN.05</small></span>
    <i>→</i>
    <span>TCCD<br><small>Chức danh cần gì?</small></span>
    <i>→</i>
    <span>Cấp độ<br><small>Cần ở mức nào?</small></span>
    <i>→</i>
    <span>Đánh giá<br><small>Hiện tại ở đâu?</small></span>
  </div>

  <div class="callout ok">
    <b>Từ điển năng lực</b> giải thích nội hàm năng lực và các cấp độ.
    <b>TCCD</b> xác định chức danh cụ thể cần năng lực nào và ở cấp độ nào.
  </div>
</section>`
},

/* ===================== 16 ===================== */
{
chapter:"Module 2 · Đọc chuẩn năng lực",
html:`

      <h3>Sử dụng tiếng Việt</h3>

    <article>
      <b>KN.02</b>
      <h3>Kỹ năng giao tiếp</h3>
      <p>
        Truyền đạt, trao đổi và tương tác hiệu quả trong công việc.
      </p>
    </article>

    <article>
      <b>KN.03</b>
      <h3>Kỹ năng đàm phán</h3>
      <p>
        Trao đổi và xử lý các tình huống cần thương lượng.
      </p>

    <article>
      <b>KN.04</b>
      <h3>Tin học & phần mềm</h3>
      <p>

      </p>
    </article>

    <article>
      <b>KN.05</b>
      <h3>Ứng dụng công nghệ số</h3>
      <p>
        Ứng dụng công nghệ số như AI, IoT, Cloud phù hợp với công việc.
      </p>
    </article>
  </div>
</section>`
},

/* ===================== 42 ===================== */
{
chapter:"Module 5 · Phát triển theo TCCD",

<section class="slide">

  <h2>Nhóm nào tôi cần ưu tiên phát triển?</h2>

  <p class="lead">
    Kéo thanh từ 1 đến 5 theo cảm nhận hiện tại.
    Đây là hoạt động học tập, không thay thế đánh giá TCCD chính thức.
  </p>

  <div id="selfReview">
    ${[
      "Kiến thức chuyên môn",
      "Kỹ năng giao tiếp",
      "Dữ liệu & báo cáo",
      "Công nghệ số & AI",
      "Ngoại ngữ",
      "Tư duy / giải quyết vấn đề"
    ].map((x,i)=>`
      <div class="reviewRow">
        <b>${x}</b>
        <input type="range" min="1" max="5" value="3"
          data-name="${x}"
          oninput="this.nextElementSibling.textContent=this.value">
        <strong>3</strong>
      </div>
    `).join("")}
  </div>

  <button class="primary" onclick="reviewResult()">
    Xem gợi ý ưu tiên
  </button>

  <div id="reviewFeedback" class="feedback"></div>
</section>`

const stage = document.getElementById("stage");

stage.innerHTML = slides.map(x => x.html).join("");

const slideEls = Array.from(
  document.querySelectorAll("#stage .slide")
);

let current = 0;

function renderSlide(){

  slideEls.forEach((s,i)=>{
    s.classList.remove("active","old");

    if(i < current){
      s.classList.add("old");
    }

    if(i === current){
      s.classList.add("active");
    }
  });

  document.getElementById("cur").textContent =
    String(current + 1).padStart(2,"0");

  document.getElementById("bar").style.width =
    ((current + 1) / slideEls.length * 100) + "%";

  document.getElementById("chapter").textContent =
    slides[current].chapter || "";

  if(current === 44){
    renderQuizQuestion();
  }

  if(current === 45){
    renderFinalResult();
  }
}

function go(n){

  if(n < 0) n = 0;

  if(n >= slideEls.length){
    n = slideEls.length - 1;
  }

  current = n;
  renderSlide();
}

function next(){
  if(current < slideEls.length - 1){
    current++;
    renderSlide();
  }
}

function prev(){
  if(current > 0){
    current--;
    renderSlide();
  }
}

document.addEventListener("keydown",e=>{

  const tag =
    document.activeElement &&
    document.activeElement.tagName;

  if(["INPUT","TEXTAREA","SELECT"].includes(tag)){
    return;
  }

  if(
    e.key === "ArrowRight" ||
    e.key === "PageDown"
  ){
    next();
  }

  if(
    e.key === "ArrowLeft" ||
    e.key === "PageUp"
  ){
    prev();
  }

  if(e.key === "Home"){
    go(0);
  }

  if(e.key === "End"){
    go(slideEls.length - 1);
  }
});

let quizIndex = 0;
let quizSelected = null;
let quizUserAnswers = [];

function startQuiz(){

  quizIndex = 0;
  quizSelected = null;
  quizUserAnswers = [];

  go(44);

  setTimeout(
    renderQuizQuestion,
    30
  );
}

function renderQuizQuestion(){

  const qEl =
    document.getElementById("quizQuestion");

  const aEl =
    document.getElementById("quizAnswers");

  const meta =
    document.getElementById("quizMeta");

  const prog =
    document.getElementById("quizProgress");

  const nextBtn =
    document.getElementById("quizNext");

  if(!qEl || !aEl || !meta || !prog){
    return;
  }

  if(quizIndex >= QUIZ.length){
    finishQuiz();
    return;
  }

  const q = QUIZ[quizIndex];

  quizSelected = null;

  meta.textContent =
    `Câu ${quizIndex + 1} / ${QUIZ.length}`;

  prog.style.width =
    ((quizIndex + 1) / QUIZ.length * 100) + "%";

  qEl.textContent = q.q;

  aEl.innerHTML =
    q.options.map((option,i)=>`
      <button
        onclick="selectQuizAnswer(${i},this)">
        <b>${String.fromCharCode(65+i)}.</b>
        ${option}
      </button>
    `).join("");

  if(nextBtn){

    nextBtn.disabled = true;

    nextBtn.textContent =
      quizIndex === QUIZ.length - 1
      ? "Xem kết quả"
      : "Câu tiếp theo →";
  }
}

function selectQuizAnswer(index,button){

  quizSelected = index;

  document
    .querySelectorAll("#quizAnswers button")
    .forEach(x=>{
      x.classList.remove("good","bad");
      x.style.background = "#fff";
      x.style.borderColor = "#d7e1e3";
    });

  button.style.background = "#eef5f6";
  button.style.borderColor = "#47717c";

  document.getElementById("quizNext").disabled = false;
}

function quizNextQuestion(){

  if(quizSelected === null){
    return;
  }

  quizUserAnswers[quizIndex] =
    quizSelected;

  quizIndex++;

  if(quizIndex >= QUIZ.length){

    finishQuiz();

  }else{

    renderQuizQuestion();
  }
}

function finishQuiz(){

  let score = 0;

  QUIZ.forEach((q,i)=>{

    if(quizUserAnswers[i] === q.answer){
      score++;
    }

  });

  const percent =
    Math.round(
      score / QUIZ.length * 100
    );

  const passed =
    score >= 12;

  localStorage.setItem(
    "PVEP_TCCD_QUIZ_RESULT",
    JSON.stringify({
      score,
      percent,
      passed,
      completedAt:
        new Date().toISOString()
    })
  );

  go(45);

  setTimeout(
    renderFinalResult,
    30
  );
}

         arr[index] !== ""
         ? arr[index]
         : "—";
}


function rGradeIndex(grade){

  const r = TCCD[Number(roleSel.value)];

  if(!r || !Array.isArray(r.grades)){
    return -1;
  }

  return r.grades.indexOf(Number(grade));
}


/* =========================================================
   HIỂN THỊ CHI TIẾT CHỨC DANH
========================================================= */

function renderRole(){

  const r = TCCD[Number(roleSel.value)];

  if(!r) return;

  const grade = Number(gradeSel.value);

  const gradeIndex =
    r.grades.indexOf(grade);


  /* -------------------------
     KINH NGHIỆM
  ------------------------- */

  let experienceHTML = "";

  if(Array.isArray(r.experience)){

    experienceHTML = r.experience.map(item => {

      let value = "—";

      if(
        Array.isArray(item.values) &&
        gradeIndex >= 0 &&
        item.values[gradeIndex] !== undefined &&
        item.values[gradeIndex] !== null &&
        item.values[gradeIndex] !== ""
      ){
        value = item.values[gradeIndex];
      }

      let displayValue = value;

      if(
        value !== "—" &&
        typeof value === "number"
      ){
        displayValue = `${value} năm`;
      }

      return `
        <div style="margin-bottom:10px">
          <b>${esc(item.label || "Kinh nghiệm")}</b>
          <br>
          ${esc(displayValue)}
        </div>
      `;

    }).join("");

  }

  if(!experienceHTML){
    experienceHTML = "—";
  }


  /* -------------------------
     NGOẠI NGỮ
  ------------------------- */

  let foreign = "—";

  if(
    Array.isArray(r.foreign) &&
    gradeIndex >= 0 &&
    r.foreign[gradeIndex] !== undefined &&
    r.foreign[gradeIndex] !== null &&
    r.foreign[gradeIndex] !== ""
  ){
    foreign = r.foreign[gradeIndex];
  }


  /* -------------------------
     CÁC TIÊU CHÍ NĂNG LỰC
  ------------------------- */

  let rows = "";
  let lastSection = "";

  if(Array.isArray(r.criteria)){

    r.criteria.forEach(c => {

      if(
        c.section &&
        c.section !== lastSection
      ){

        rows += `
          <tr class="sectionRow">
            <td colspan="4">
              ${esc(c.section)}
            </td>
          </tr>
        `;

        lastSection = c.section;
      }


      let level = "—";

      if(
        Array.isArray(c.levels) &&
        gradeIndex >= 0 &&
        c.levels[gradeIndex] !== undefined &&
        c.levels[gradeIndex] !== null &&
        c.levels[gradeIndex] !== ""
      ){
        level = c.levels[gradeIndex];
      }


      rows += `
        <tr>

          <td>
            ${esc(c.no || "")}
          </td>

          <td>
            ${esc(c.name || "")}
          </td>

          <td>
            ${esc(c.code || "")}
          </td>

          <td class="lv">
            ${esc(level)}
          </td>

        </tr>
      `;

    });
  }


  /* -------------------------
     RENDER
  ------------------------- */

  lookupBody.innerHTML = `

    <div class="roleTitle">

      <div>

        <span class="badge">
          ${esc(r.unit)}
        </span>

        <span class="badge">
          Bậc ${grade}
        </span>

        <h2 style="margin-top:14px">
          ${esc(r.title)}
        </h2>

        ${
          r.code
          ? `<p><b>Mã chức danh:</b> ${esc(r.code)}</p>`
          : ""
        }

      </div>

    </div>


    <div class="reqGrid">

      <div class="req">

        <b>I. Bằng cấp</b>

        <p>
          ${
            r.degree
            ? esc(r.degree)
            : "Không có thông tin riêng trong dữ liệu nguồn."
          }
        </p>

      </div>


      <div class="req">

        <b>II. Kinh nghiệm</b>

        <div style="margin-top:10px">
          ${experienceHTML}
        </div>

      </div>


      <div class="req">

        <b>Sức khỏe</b>

        <p>
          ${
            r.health
            ? esc(r.health)
            : "Theo yêu cầu trong bảng TCCD nguồn."
          }
        </p>

      </div>


      <div class="req">

        <b>Ngoại ngữ</b>

        <p>

          ${
            foreign !== "—"
            ? `TOEIC tương đương:
               <strong>${esc(foreign)}</strong>`
            : "Không có giá trị riêng tại bậc này."
          }

        </p>

      </div>

    </div>


    <h3 style="
      margin-top:28px;
      color:#315766
    ">
      Kiến thức · Kỹ năng · Năng lực
    </h3>


    <div style="
      overflow:auto;
      border-radius:12px
    ">

      <table>

        <thead>

          <tr>

            <th style="width:70px">
              STT
            </th>

            <th>
              Năng lực / kiến thức / kỹ năng
            </th>

            <th style="width:120px">
              Mã
            </th>

            <th style="width:120px">
              Cấp độ yêu cầu
            </th>

          </tr>

        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>


    <div class="sourceNote">

      <b>Nguồn:</b>
      Bộ TCCD chi tiết do PVEP cung cấp
      · Sheet: ${esc(r.sheet || "")}.

      <br>

      Dữ liệu trong phần tra cứu được hiển thị
      theo giá trị của bảng nguồn,
      không tự thay đổi tiêu chuẩn của chức danh.

    </div>

  `;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[char]
    );
}


/* =========================================================
   MỞ / ĐÓNG TRA CỨU
========================================================= */

function openLookup(){

  lookup.classList.add("on");

  if(!roleSel.options.length){
    rolesForUnit();
  }

  renderRole();
}


function closeLookup(){

  lookup.classList.remove("on");
}


/* =========================================================
   SỰ KIỆN
========================================================= */

unitSel.addEventListener(
  "change",
  rolesForUnit
);

roleSel.addEventListener(
  "change",
  roleChange
);

gradeSel.addEventListener(
  "change",
  renderRole
);


lookup.addEventListener(
  "click",
  e => {

    if(e.target === lookup){
      closeLookup();
    }

  }
);


document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Escape" &&
      lookup.classList.contains("on")
    ){
      closeLookup();
    }

  }
);


/* =========================================================
   KHỞI TẠO TRA CỨU
========================================================= */

rolesForUnit();


/* =========================================================
   KIỂM TRA DỮ LIỆU
========================================================= */

console.log(
  "PVEP TCCD:",
  TCCD.length,
  "chức danh đã được nạp."
);


/* =========================================================
   KHỞI ĐỘNG E-LEARNING
========================================================= */

renderSlide();

</script>

</body>
